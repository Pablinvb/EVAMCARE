name: Security and deployment checks
on:
  push:
    branches: ["codex/security-persistence"]
  pull_request:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-ephemeral-password
          POSTGRES_DB: evamcare_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci-only-ephemeral-password@localhost:5432/evamcare_test
      DERMASCAN_POSTGRES_SSLMODE: disable
      DERMASCAN_POSTGRES_SCHEMA: evamcare_local_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Prepare isolated Supabase platform stub
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/postgres_supabase_stub.sql
      - name: Apply prepared Supabase Auth migration and execute RLS tests
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/202610040001_skin_records.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/authorization.sql
      - name: Existing API and account workflows on PostgreSQL
        run: |
          python -m unittest discover -s tests -p test_api.py -v
          python -m unittest discover -s tests -p test_accounts.py -v
          python -m unittest discover -s tests -p test_patient_platform.py -v
          python -m unittest discover -s tests -p test_postgres.py -v
  verify:
    runs-on: ubuntu-latest
    env:
      DERMASCAN_DATABASE_PATH: /tmp/evamcare-ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt pglast
      - run: python -m unittest discover -s tests -v
      - run: node --check app.js && node --check assets/accounts.js && node --check assets/navigation.js
      - name: Parse prepared PostgreSQL SQL (not a live RLS test)
        run: python -c "from pathlib import Path; from pglast import parse_sql; [parse_sql(p.read_text()) for p in Path('supabase').rglob('*.sql')]"
      - name: Verify container build
        run: docker build -t evamcare-security-check .
      - name: Verify static bundle
        run: |
          mkdir -p /tmp/evamcare-site
          cp index.html app.js styles.css config.js /tmp/evamcare-site/
          cp -R assets /tmp/evamcare-site/
          test -f /tmp/evamcare-site/assets/accounts.js
